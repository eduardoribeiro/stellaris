name: Sync Zed upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-zed-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-zed-main
    steps:
      - name: Checkout default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch Zed upstream
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git 2>/dev/null || true
          git fetch --no-tags upstream main

      - name: Merge upstream changes
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main "origin/$DEFAULT_BRANCH"; then
            echo "Zed upstream is already included in $DEFAULT_BRANCH."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch --force-create "$SYNC_BRANCH" "origin/$DEFAULT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit --no-ff upstream/main
          git push --force-with-lease --set-upstream origin "$SYNC_BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Create synchronization pull request
        if: steps.merge.outputs.updated == 'true'
        run: |
          if gh pr view "$SYNC_BRANCH" --json number --jq '.number' >/dev/null 2>&1; then
            echo "Updated existing upstream synchronization pull request."
            exit 0
          fi

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "Sync with Zed upstream" \
            --body $'Automated merge of [zed-industries/zed](https://github.com/zed-industries/zed) main into Stellaris.\n\nReview upstream changes and validate Stellaris-specific functionality before merging.\n\nRelease Notes:\n\n- N/A'

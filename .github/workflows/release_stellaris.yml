name: Release Stellaris

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["RELEASE_VERSION"]
          semver = re.compile(
              r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)"
              r"(?:-(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )
          if not semver.fullmatch(version):
              sys.exit(f"Invalid semantic version: {version!r}")
          with open("crates/zed/Cargo.toml", encoding="utf-8") as manifest:
              manifest_version = next(
                  line.split('"', 2)[1]
                  for line in manifest
                  if line.startswith("version = ")
              )
          if version != manifest_version:
              sys.exit(
                  f"Release version {version!r} does not match the application version "
                  f"{manifest_version!r}. Update crates/zed/Cargo.toml first."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

  build-macos:
    needs: validate-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build unsigned macOS artifact
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          STELLARIS_UPDATE_URL: https://api.github.com/repos/${{ github.repository }}/releases?per_page=30
          ZED_COMMIT_SHA: ${{ github.sha }}
        run: script/build-stellaris
      - name: Package unsigned macOS artifact
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: script/package-stellaris
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: stellaris-macos-aarch64
          path: target/release/Stellaris-*-aarch64-macos.zip
          if-no-files-found: error

  build-linux:
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: script/linux
      - name: Build Linux artifact
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          STELLARIS_UPDATE_URL: https://api.github.com/repos/${{ github.repository }}/releases?per_page=30
          ZED_COMMIT_SHA: ${{ github.sha }}
        run: script/build-stellaris-linux
      - name: Package Linux artifact
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: script/package-stellaris-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: stellaris-linux-x86_64
          path: target/release/Stellaris-*-x86_64-linux.tar.gz
          if-no-files-found: error

  create-release:
    needs: [validate-version, build-macos, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          assets=(
            artifacts/stellaris-macos-aarch64/Stellaris-*-aarch64-macos.zip
            artifacts/stellaris-linux-x86_64/Stellaris-*-x86_64-linux.tar.gz
          )
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "Stellaris ${tag}" --generate-notes
          fi
